<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medidor de IMC</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #111827;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
      text-align: center;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #052e16;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .resultado {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      background: #0f172a;
      text-align: center;
    }

    .imc {
      font-size: 32px;
      font-weight: bold;
      color: #22c55e;
    }

    .erro {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #7f1d1d;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Medidor de IMC</h1>

    <form method="POST">
      <label for="peso">Peso (kg)</label>
      <input type="text" id="peso" name="peso" placeholder="Ex: 70" required>

      <label for="altura">Altura (m)</label>
      <input type="text" id="altura" name="altura" placeholder="Ex: 1.75" required>

      <button type="submit">Calcular IMC</button>
    </form>

    {% if erro %}
      <div class="erro">{{ erro }}</div>
    {% endif %}

    {% if imc %}
      <div class="resultado">
        <p>Seu IMC é:</p>
        <div class="imc">{{ "%.2f"|format(imc) }}</div>
        <p>{{ classificacao }}</p>
      </div>
    {% endif %}
  </main>
</body>
</html>
